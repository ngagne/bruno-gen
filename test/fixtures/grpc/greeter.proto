syntax = "proto3";

package example.greeter;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc WatchGreetings (HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
  repeated string aliases = 2;
}

message HelloReply {
  string message = 1;
}
