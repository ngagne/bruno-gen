openapi: "3.0.3"
info:
  title: GitHub-like Repository API
  description: A repository management API inspired by GitHub, exercising multi-segment path params, multiple response types, and pagination.
  version: "v3"
  contact:
    name: Developer Support
    url: https://developer.example-repos.com
servers:
  - url: https://api.example-repos.com
    description: Production server

security:
  - BearerAuth: []

paths:
  /repos/{owner}/{repo}:
    get:
      operationId: getRepository
      summary: Get a repository
      description: Get detailed information about a specific repository.
      tags:
        - Repositories
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          example: octocat
        - name: repo
          in: path
          required: true
          schema:
            type: string
          example: hello-world
      responses:
        "200":
          description: Repository details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
              examples:
                sample:
                  value:
                    full_name: octocat/hello-world
                    description: My first repository
                    public: true
                    stargazers_count: 1420
                    forks_count: 88
        "404":
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRepository
      summary: Update a repository
      tags:
        - Repositories
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryRequest"
      responses:
        "200":
          description: Repository updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"

  /repos/{owner}/{repo}/issues:
    get:
      operationId: listIssues
      summary: List repository issues
      tags:
        - Issues
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - closed
              - all
            default: open
        - name: labels
          in: query
          schema:
            type: string
          description: Comma-separated list of label names
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        "200":
          description: List of issues
          headers:
            Link:
              schema:
                type: string
              description: Pagination links (next, prev, last)
            X-Total-Count:
              schema:
                type: integer
              description: Total number of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      operationId: createIssue
      summary: Create an issue
      tags:
        - Issues
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
            examples:
              bug:
                value:
                  title: "Bug: Application crashes on startup"
                  body: "The app crashes immediately after launching."
                  labels:
                    - bug
                    - critical
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /repos/{owner}/{repo}/issues/{issue_number}:
    get:
      operationId: getIssue
      summary: Get an issue
      tags:
        - Issues
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: issue_number
          in: path
          required: true
          schema:
            type: integer
          example: 42
      responses:
        "200":
          description: Issue details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}:
    get:
      operationId: getUser
      summary: Get a user
      tags:
        - Users
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: octocat
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}/repos:
    get:
      operationId: listUserRepositories
      summary: List repositories for a user
      tags:
        - Repositories
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum:
              - all
              - owner
              - member
            default: owner
      responses:
        "200":
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"

  /repos/{owner}/{repo}/branches:
    get:
      operationId: listBranches
      summary: List repository branches
      tags:
        - Branches
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: protected
          in: query
          schema:
            type: boolean
          description: Filter by protection status
      responses:
        "200":
          description: List of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Personal access token or OAuth2 bearer token

  schemas:
    Repository:
      type: object
      required:
        - id
        - name
        - full_name
      properties:
        id:
          type: integer
          format: int64
          example: 1296269
        name:
          type: string
          example: hello-world
        full_name:
          type: string
          example: octocat/hello-world
        owner:
          $ref: "#/components/schemas/User"
        description:
          type: string
          example: "My first repository on GitHub!"
        public:
          type: boolean
          example: true
        html_url:
          type: string
          format: uri
          example: "https://github.com/octocat/hello-world"
        stargazers_count:
          type: integer
          example: 1420
        forks_count:
          type: integer
          example: 88
        open_issues_count:
          type: integer
          example: 12
        default_branch:
          type: string
          example: main
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateRepositoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        homepage:
          type: string
          format: uri
        private:
          type: boolean
        has_issues:
          type: boolean
        has_wiki:
          type: boolean
        default_branch:
          type: string

    Issue:
      type: object
      required:
        - id
        - number
        - title
        - state
      properties:
        id:
          type: integer
          format: int64
          example: 1
        number:
          type: integer
          example: 42
        title:
          type: string
          example: "Found a bug"
        state:
          type: string
          enum:
            - open
            - closed
          example: open
        body:
          type: string
          example: "I'm having a problem with this feature."
        user:
          $ref: "#/components/schemas/User"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/User"
        comments:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time

    CreateIssueRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: "Bug: Application crashes on startup"
        body:
          type: string
          example: "The app crashes immediately after launching."
        labels:
          type: array
          items:
            type: string
          example:
            - bug
            - critical
        assignees:
          type: array
          items:
            type: string
          example:
            - octocat

    Label:
      type: object
      properties:
        id:
          type: integer
          example: 246762115
        name:
          type: string
          example: bug
        color:
          type: string
          example: "f29513"
        description:
          type: string
          example: "Something isn't working"

    User:
      type: object
      required:
        - login
        - id
      properties:
        login:
          type: string
          example: octocat
        id:
          type: integer
          format: int64
          example: 1
        avatar_url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
          example: "https://github.com/octocat"
        type:
          type: string
          enum:
            - User
            - Organization
          example: User
        site_admin:
          type: boolean
          example: false

    Branch:
      type: object
      properties:
        name:
          type: string
          example: main
        protected:
          type: boolean
          example: true
        commit:
          $ref: "#/components/schemas/CommitSummary"

    CommitSummary:
      type: object
      properties:
        sha:
          type: string
          example: 6dcb09b5b57875f334f61aebed695e2e4193db5e
        message:
          type: string
          example: "Fix all the bugs"
        author:
          $ref: "#/components/schemas/User"
        committer:
          $ref: "#/components/schemas/User"

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Not Found"
        documentation_url:
          type: string
          format: uri
          example: "https://docs.example-repos.com/rest"
